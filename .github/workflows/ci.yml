name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - run: dotnet restore BozForge.DiAudit.slnx
      - run: dotnet build BozForge.DiAudit.slnx -c Release --no-restore
      - run: dotnet test BozForge.DiAudit.slnx -c Release --no-build
      - run: dotnet pack src/BozForge.DiAudit -c Release --no-build -o artifacts
      - run: dotnet pack src/BozForge.DiAudit.AspNetCore -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*
